<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LexiSummarize AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">
    <div class="app-card">

        <header>
            <h1>⚖️ AI-Based Legal Document Summarizer</h1>
        </header>

        <section class="upload-section">
            <label class="file-box">
                <input type="file" id="fileInput" accept=".pdf,.docx,.txt">
                <span>📄 Choose a legal document</span>
            </label>

            <button onclick="uploadFile()">Generate Summary</button>
        </section>

        <section class="summary-section">
            <h3>📑 Summary</h3>
            <textarea id="summaryOutput" placeholder="Your AI-generated summary will appear here..." readonly></textarea>
            <button class="copy-btn" onclick="copySummary()">📋 Copy Summary</button>
        </section>

        <footer>
            🔐 Files are processed securely and deleted automatically
        </footer>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
